<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">tokensbeat</title>
  <desc id="desc">A jade core crossed by a single orbit that ends in a moon: models at the center, creation in motion around them.</desc>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="#202522"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="119.25" fill="none" stroke="#CED4CA" stroke-opacity=".14" stroke-width="1.5"/>

  <g transform="translate(256 256) scale(.98) translate(-265 -254)" stroke-linecap="round">
    <circle cx="256" cy="256" r="92" fill="#3FD1B5"/>
    <g transform="rotate(-22 256 256)" fill="none">
      <!-- Graphite underlay cuts a clean gap where the orbit crosses the core. -->
      <path d="M78 256A178 62 0 0 0 434 256" stroke="#202522" stroke-width="54"/>
      <path d="M78 256A178 62 0 0 0 434 256" stroke="#AEE6D7" stroke-width="26"/>
    </g>
    <circle cx="421" cy="189" r="30" fill="#FAFBF8" stroke="#202522" stroke-width="14"/>
  </g>
</svg>
