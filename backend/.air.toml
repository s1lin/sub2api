root = "."
tmp_dir = "tmp"

[build]
bin = ".\\tmp\\server.exe"
cmd = "go build -o ./tmp/server.exe ./cmd/server"
delay = 1000
exclude_dir = ["assets", "tmp", "vendor", "testdata", "resources", "dev-docs", "data", "bin", ".git"]
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
exclude_regex = ["_test\\.go"]
stop_on_error = true
env = ["DATA_DIR=."]

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
time = true

[misc]
clean_on_exit = true
