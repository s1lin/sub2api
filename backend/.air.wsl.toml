root = "."
tmp_dir = "tmp"

[build]
bin = "./tmp/server-wsl"
cmd = "go build -o ./tmp/server-wsl ./cmd/server"
delay = 1000
exclude_dir = ["assets", "tmp", "vendor", "testdata", "resources", "dev-docs", "data", ".git"]
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
exclude_regex = ["_test\\.go"]
stop_on_error = true
env = ["DATA_DIR=."]
poll = true
poll_interval = 1000

[log]
time = true

[misc]
clean_on_exit = true
